# Optional: rebuild every 30 minutes on GitHub Actions and commit the result
# (works with GitHub Pages, or Netlify/Cloudflare Pages connected to the repo).
name: Daily Rush Report build
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
  push: {paths: ["picks.json", "feeds.json", "build.py"]}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 build.py
      - run: |
          git config user.name "daily-rush-report-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A index.html archive .state social_drafts CNAME
          git diff --cached --quiet || git commit -m "Rebuild $(date -u +%FT%TZ)" && git push
